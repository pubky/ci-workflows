name: "Delete Cloud Run service"
description: "Authenticate to GCP with a service account key and delete a Cloud Run service via the Cloud Run Admin API"

inputs:
  gcp_service_account_key:
    description: "Service account key JSON used to authenticate to GCP"
    required: true
  region:
    description: "Cloud Run region"
    required: true
  service:
    description: "Name of the Cloud Run service to delete"
    required: true
  project_id:
    description: "GCP project ID (defaults to the project of the credentials)"
    required: false
    default: ""
  ignore_not_found:
    description: "Treat a missing service (HTTP 404) as success"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Authenticate to GCP
      id: auth
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
      with:
        credentials_json: ${{ inputs.gcp_service_account_key }}

    # gcloud mints the access token straight from the key. auth's
    # token_format=access_token would instead call iam.serviceAccounts.getAccessToken,
    # which needs roles/iam.serviceAccountTokenCreator on the service account itself.
    - name: Set up gcloud
      uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

    - name: Delete Cloud Run service
      shell: bash
      env:
        SERVICE: ${{ inputs.service }}
        REGION: ${{ inputs.region }}
        PROJECT: ${{ inputs.project_id || steps.auth.outputs.project_id }}
        IGNORE_NOT_FOUND: ${{ inputs.ignore_not_found }}
      run: |
        set -euo pipefail
        TOKEN=$(gcloud auth print-access-token)
        echo "::add-mask::$TOKEN"
        body="${RUNNER_TEMP}/delete.json"
        code=$(curl -sS -X DELETE -o "$body" -w '%{http_code}' \
          -H "Authorization: Bearer $TOKEN" \
          "https://run.googleapis.com/v2/projects/${PROJECT}/locations/${REGION}/services/${SERVICE}")
        if [[ "$code" == 2* ]]; then
          echo "Deleted Cloud Run service ${SERVICE} (HTTP ${code})"
        elif [[ "$code" == 404 && "$IGNORE_NOT_FOUND" == "true" ]]; then
          echo "Service ${SERVICE} not found, nothing to delete"
        else
          echo "::error::Delete failed (HTTP ${code})"
          cat "$body"
          exit 1
        fi
