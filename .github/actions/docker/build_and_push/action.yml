name: Build and Push Multi-arch Docker Image
description: "Build a multi-arch image and push it to a GCP or Docker Hub registry"

inputs:
  registry:
    required: true
    type: string
  image:
    required: true
    type: string
  tags:
    required: false
    type: string
    default: ''
  latest:
    required: false
    type: boolean
    default: false
  platforms:
    required: false
    type: string
    default: |
      linux/amd64
  build_args:
    required: false
    type: string
    default: ''
  context:
    required: false
    type: string
    default: '.'
  docker_file:
    required: false
    type: string
    default: 'Dockerfile'
  sha_tag:
    required: false
    type: boolean
    default: true
  push:
    required: false
    type: boolean
    default: true
  cache_from:
    required: false
    type: string
    default: ""
  cache_to:
    required: false
    type: string
    default: ""
  gcp_service_account_key:
    required: false
  docker_registy_login:
    required: false
  docker_registy_password:
    required: false

runs:
  using: "composite"
  steps:
  - name: Set up QEMU
    uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
    if: ${{ contains(inputs.platforms, 'linux/arm64') }}

  - name: Set up Docker Buildx
    uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

  - name: Install Cosign
    uses: sigstore/cosign-installer@v3

  - name: Set HEAD commit hash
    id: sha_tag
    shell: bash
    env:
      CONTEXT_PATH: ${{ inputs.context }}
    run: |
      cd "$CONTEXT_PATH"
      echo "hash=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
    if: ${{ inputs.sha_tag }}

  - name: Set cache values
    shell: bash
    id: cache
    env:
      CACHE_FROM_INPUT: ${{ inputs.cache_from }}
      CACHE_TO_INPUT: ${{ inputs.cache_to }}
      REGISTRY: ${{ inputs.registry }}
      IMAGE: ${{ inputs.image }}
    run: |
      CACHE_FROM="$CACHE_FROM_INPUT"
      CACHE_TO="$CACHE_TO_INPUT"

      if [ -z "$CACHE_FROM" ]; then
        CACHE_FROM="type=registry,ref=$REGISTRY/$IMAGE:cache"
      fi

      if [ -z "$CACHE_TO" ]; then
        CACHE_TO="type=registry,ref=$REGISTRY/$IMAGE:cache,mode=max"
      fi

      echo "from=$CACHE_FROM" >> "$GITHUB_OUTPUT"
      echo "to=$CACHE_TO" >> "$GITHUB_OUTPUT"

  - name: Set image tags
    id: meta
    uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
    with:
      images: |
        ${{ inputs.registry }}/${{ inputs.image }}
      tags: |
        type=raw,value=latest,enable=${{ inputs.latest }}
        type=raw,value=${{ steps.sha_tag.outputs.hash }},enable=${{ inputs.sha_tag }}
        ${{ inputs.tags }}

  - name: Build and push image
    id: build
    uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
    with:
      push: ${{ inputs.push }}
      platforms: ${{ inputs.platforms }}
      context: ${{ github.workspace }}/${{ inputs.context }}
      file: ${{ github.workspace }}/${{ inputs.context }}/${{ inputs.docker_file }}
      tags: ${{ steps.meta.outputs.tags }}
      build-args: |
        ${{ inputs.build_args }}
        ${{ contains(inputs.platforms, 'linux/arm64') && 'TARGETARCH=aarch64' || ''}}
      labels: ${{ steps.meta.outputs.labels }}
      cache-from: ${{ steps.cache.outputs.from }}
      cache-to: ${{ steps.cache.outputs.to }}

  # Use Fulcio public server for signing
  - name: Sign Image
    id: sign
    shell: bash
    if: ${{ steps.build.conclusion == 'success' }}
    run: cosign sign --yes ${{ inputs.registry }}/${{ inputs.image }}@${{ steps.build.outputs.digest }}

  - name: Verify Signature
    id: verify
    shell: bash
    if: ${{ steps.sign.conclusion == 'success' }}
    run: |
      URL="${{github.server_url}}/${{ github.workflow_ref }}"
      COSIGN_VERIFY_COMMAND=(
                              cosign verify --output json
                              --certificate-identity-regexp="$URL"
                              --certificate-oidc-issuer="https://token.actions.githubusercontent.com"
                              ${{ inputs.registry }}/${{ inputs.image }}@${{ steps.build.outputs.digest }} 
                            )
      COSIGN_VERIFY_RESULT=$("${COSIGN_VERIFY_COMMAND[@]}")

      echo "# Cosign Verification" >> $GITHUB_STEP_SUMMARY

      if [ $? -eq 0 ]; then
        echo "✅ **Cosign Signature Verified Successfully**" >> $GITHUB_STEP_SUMMARY
        SUBJECT=$(echo "$COSIGN_VERIFY_RESULT" | jq -r '.[0].optional.Subject')
        ISSUER=$(echo "$COSIGN_VERIFY_RESULT" | jq -r '.[0].optional.Issuer')
        DIGEST=$(echo "$COSIGN_VERIFY_RESULT" | jq -r '.[0].critical.image."docker-manifest-digest"')
        DOCKER_REFERENCE=$(echo "$COSIGN_VERIFY_RESULT" | jq -r '.[0].critical.identity."docker-reference"')

        echo "**Subject:** $SUBJECT" >> $GITHUB_STEP_SUMMARY
        echo "**Issuer:**  $ISSUER"  >> $GITHUB_STEP_SUMMARY
        echo "**Digest:**  $DIGEST"  >> $GITHUB_STEP_SUMMARY
        echo "**Docker Reference:** $DOCKER_REFERENCE" >> $GITHUB_STEP_SUMMARY
        echo ""
        echo "### Verify Locally" >> $GITHUB_STEP_SUMMARY
        echo '```shell' >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "${COSIGN_VERIFY_COMMAND[@]}" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
      else
        echo "❌ **Cosign Signature Verification Failed**" >> $GITHUB_STEP_SUMMARY
        echo "Verification failed for: $DIGEST" >> $GITHUB_STEP_SUMMARY
        exit 1
      fi