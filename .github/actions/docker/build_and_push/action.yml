name: Build and Push Multi-arch Docker Image
description: "Build a multi-arch image and push it to a GCP or Docker Hub registry"

inputs:
  registry:
    required: true
    type: string
  image:
    required: true
    type: string
  tags:
    required: false
    type: string
    default: ''
  latest:
    required: false
    type: boolean
    default: false
  platforms:
    required: false
    type: string
    default: |
      linux/amd64
  build_args:
    required: false
    type: string
    default: ''
  context:
    required: false
    type: string
    default: '.'
  docker_file:
    required: false
    type: string
    default: 'Dockerfile'
  sha_tag:
    required: false
    type: boolean
    default: true
  push:
    required: false
    type: boolean
    default: true
  cache_from:
    required: false
    type: string
    default: ""
  cache_to:
    description: 'Cache export destinations; empty uses the registry default, "false" disables export'
    required: false
    type: string
    default: ""
  gcp_service_account_key:
    required: false
  docker_registy_login:
    required: false
  docker_registy_password:
    required: false

runs:
  using: "composite"
  steps:
  - name: Set up QEMU
    uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
    if: ${{ contains(inputs.platforms, 'linux/arm64') }}

  - name: Set up Docker Buildx
    uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

  - name: Set HEAD commit hash
    id: sha_tag
    shell: bash
    env:
      CONTEXT_PATH: ${{ inputs.context }}
    run: |
      cd "$CONTEXT_PATH"
      echo "hash=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
    if: ${{ inputs.sha_tag }}

  - name: Set cache values
    shell: bash
    id: cache
    env:
      CACHE_FROM_INPUT: ${{ inputs.cache_from }}
      CACHE_TO_INPUT: ${{ inputs.cache_to }}
      REGISTRY: ${{ inputs.registry }}
      IMAGE: ${{ inputs.image }}
    run: |
      CACHE_FROM="$CACHE_FROM_INPUT"
      CACHE_TO="$CACHE_TO_INPUT"

      if [ -z "$CACHE_FROM" ]; then
        CACHE_FROM="type=registry,ref=$REGISTRY/$IMAGE:cache"
      fi

      if [ "$CACHE_TO" = "false" ]; then
        CACHE_TO=""
      elif [ -z "$CACHE_TO" ]; then
        CACHE_TO="type=registry,ref=$REGISTRY/$IMAGE:cache,mode=max"
      fi

      DELIMITER="CACHE_EOF"
      while [[ "$CACHE_FROM" == *"$DELIMITER"* || "$CACHE_TO" == *"$DELIMITER"* ]]; do
        DELIMITER="${DELIMITER}_"
      done

      {
        printf 'from<<%s\n%s\n%s\n' "$DELIMITER" "$CACHE_FROM" "$DELIMITER"
        printf 'to<<%s\n%s\n%s\n' "$DELIMITER" "$CACHE_TO" "$DELIMITER"
      } >> "$GITHUB_OUTPUT"

  - name: Set image tags
    id: meta
    uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
    with:
      images: |
        ${{ inputs.registry }}/${{ inputs.image }}
      tags: |
        type=raw,value=latest,enable=${{ inputs.latest }}
        type=raw,value=${{ steps.sha_tag.outputs.hash }},enable=${{ inputs.sha_tag }}
        ${{ inputs.tags }}

  - name: Build and push image
    id: build
    uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
    with:
      push: ${{ inputs.push }}
      platforms: ${{ inputs.platforms }}
      context: ${{ github.workspace }}/${{ inputs.context }}
      file: ${{ github.workspace }}/${{ inputs.context }}/${{ inputs.docker_file }}
      tags: ${{ steps.meta.outputs.tags }}
      build-args: |
        ${{ inputs.build_args }}
        ${{ contains(inputs.platforms, 'linux/arm64') && 'TARGETARCH=aarch64' || ''}}
      labels: ${{ steps.meta.outputs.labels }}
      cache-from: ${{ steps.cache.outputs.from }}
      cache-to: ${{ steps.cache.outputs.to }}
